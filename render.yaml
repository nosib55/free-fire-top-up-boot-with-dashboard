services:
  - type: web
    name: free-fire-topup-bot
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/google-chrome-stable
      - key: HEADLESS
        value: "true"
